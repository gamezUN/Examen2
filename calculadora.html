<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <Script>
        var numero1 = prompt("Escribe el primer numero") * 1;
        var numero2 = prompt("Escribe el segundo numero") * 1;


        var suma = numero1 + numero2;
        var resta = numero1 - numero2;
        var multiplicacion = numero1 * numero2;
        var division = numero1 / numero2;


        alert("La suma es: " + suma);
        alert("La resta es: " + resta);
        alert("La multiplicacion es: " + multiplicacion);
        alert("La division es: " + division);


        if (suma >= 100) {
            alert("¡TE PASAS!");
        }

        else {
            alert("Eres un buen alumno")//si la resta es menor a 0 es numeros negativos
            //de lo contrario son positivas

        }

        if (resta <= 0) {
            alert("Numeros negativos")
        }

        else {
            alert("son positivos")
        }
    </Script>
</head>

<body>

</body>

</html>
