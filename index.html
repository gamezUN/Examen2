<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo telefónico</title>

    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(174, 195, 172);
            margin: 0;
            padding: 20px;
        }

        .contenedor {
            background-color: rgb(119, 210, 112);
            border: 3px solid black;
            width: 10000px;
            max-width: 85%;
            margin: 30px auto;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #202020;
            font-size: 40px;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
        }

        select {
            padding: 8px;
        }

        .opciones {
            padding: 10px;
        }

        .boton {
            text-align: center;
            margin-top: 25px;
        }

        hr {
            border: 1px solid hsl(120, 30%, 60%);
        }

        #resultado {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            margin: 20px auto;
            max-width: 85%;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>RECIBO TELEFÓNICO</h1>

    <div class="contenedor">

        <form id="formulario">

            <p>Minutos de llamadas ($1.00 c/u):</p>
            <input type="number" id="minutos" name="minutos" min="0" required>

            <hr>

            <p>Tipo de plan:</p>

            <div class="opciones">
                <input type="radio" name="plan" value="telefono" required>
                Solo teléfono
                <br>

                <input type="radio" name="plan" value="internet">
                Teléfono + internet
                <br>

                <input type="radio" name="plan" value="completo">
                Teléfono + internet + TV
            </div>

            <hr>

            <p>Otros servicios:</p>

            <input type="checkbox" name="servicio" value="antivirus">
            Antivirus
            <br>

            <input type="checkbox" name="servicio" value="nube">
            Servicios de nube
            <br>

            <input type="checkbox" name="servicio" value="web">
            Servicios web

            <hr>

            <p>Paquetes:</p>

            <select name="paquetes" required>
                <option value="">Selecciona un paquete</option>
                <option value="residencial">Residencial</option>
                <option value="estandar">Estándar</option>
                <option value="privado">Privado</option>
            </select>

            <hr>

            <div class="boton">
                <button type="submit" onclick="procesar()">Calcular</button>
            </div>

        </form>

    </div>
    <div id="resultado"></div>



    <script>

        function procesar() {
            event.preventDefault();
            let minutos = document.getElementById("minutos");

            let cantidad = minutos.value;
            let costoMinutos = cantidad * 1;

            let plan = document.querySelector('input[name="plan"]:checked').value;
            let costoPlan = 0;

            if (plan == "telefono") {
                costoPlan = 100;
            }

            if (plan == "internet") {
                costoPlan = 200;
            }

            if (plan == "completo") {
                costoPlan = 300;
            }

            let total = costoMinutos + costoPlan;

            alert("El total a pagar es: $" + total);
            let resultado = document.getElementById("resultado");

            resultado.innerHTML =
                "<h2>RECIBO TELEFÓNICO</h2>" +
                "Minutos utilizados: " + cantidad + "<br>" +
                "Costo de llamadas: $" + costoMinutos + "<br>" +
                "Costo del plan: $" + costoPlan + "<br>" +
                "<hr>" +
                "<h2>TOTAL A PAGAR: $" + total + "</h2>";
                
        }
    </script>



</body>

</html>
