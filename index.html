<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo telefonico</title>


    <style>

        body{
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(119, 210, 112);
        }

        h2{
            color: black;
            font-size: 20px;
        }

        h1{
            text-align: center;
            font-size: 40px;
            color: rgb(29, 29, 29);
            margin-top: 20px;
        }

        .contenedor{
            
            border-color: black;
            padding: 10px;
            margin: 10px;
            color: black;
            margin-left: 40px;
            font-size: 200px;


        }


    </style>
</head>
<body>
    <h1>RECIBO TELEFONICO</h1>

    <div id=".contenedor">

        <hr>
        <h2>Minutos de llamadas a celular (1.00c/u)</h2>
        <input type="number" required>

        <hr>
    </div>

    <div id=".tipodeplan">
        <h2>Tipo de plan</h2>
        <select name="Lista" id="Lista">
            <option value="">solo telefono</option>
            <option value="">Telefono + internet</option>
            <option value="">Telefono + internet + tv</option>
        </select>

        <hr>
    </div>

    <div>
        <h2>Otros servicios</h2>
        <select name="" id="">
            <option value="">Antivirus</option>
            <option value="">Servicios de nube</option>
            <option value="">servicios web</option>

        </select>

        <hr>

    </div>

    <div>
        <h2>Paquetes
        </h2>

        <select name="" id="">
            <option value="">Residencial</option>
            <option value="">Estandar</option>
            <option value="">Privado</option>

        </select>
    </div>

    <div>
        <input type="button" name="calcular Recibo" id="calcular">
    </div>


</body>
</html>
