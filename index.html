
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo telefónico</title>

    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(174, 195, 172);
            margin: 0;
            padding: 20px;
        }

        .contenedor {
            background-color: rgb(119, 210, 112);
            border: 3px solid black;
            width: 10000px;
            max-width: 85%;
            margin: 30px auto;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #202020;
            font-size: 40px;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
        }

        select {
            padding: 8px;
        }

        .opciones {
            padding: 10px;
        }

        .boton {
            text-align: center;
            margin-top: 25px;
        }

        

        hr {
            border: 1px solid hsl(120, 30%, 60%);
        }
    </style>

    <script>
        alert('saludos a mi hermoso mundo que me vio nacer');
        

    </script>

</head>

<body>

    <h1>RECIBO TELEFÓNICO</h1>

    <div class="contenedor">

        

        <form>

            <p>Minutos de llamadas ($1.00 c/u):</p>
            <input type="text" name="minutos" inputmode="numeric">

            <hr>

            <p>Tipo de plan:</p>

            <div class="opciones">
                <input type="radio" name="plan" value="telefono">
                Solo teléfono

                <br>

                <input type="radio" name="plan" value="internet">
                Teléfono + internet

                <br>

                <input type="radio" name="plan" value="completo">
                Teléfono + internet + TV
            </div>

            <hr>

            <p>Otros servicios:</p>

            <input type="checkbox" name="servicio" value="antivirus">
            Antivirus

            <br>

            <input type="checkbox" name="servicio" value="nube">
            Servicios de nube

            <br>

            <input type="checkbox" name="servicio" value="web">
            Servicios web

            <hr>

            <p>Paquetes:</p>

            <select name="paquetes">
                <option value="">Selecciona un paquete</option>
                <option value="residencial">Residencial</option>
                <option value="estandar">Estándar</option>
                <option value="privado">Privado</option>
            </select>

            <hr>

            <div class="boton">
                <input type="submit" onclick="alert('Esto esta pagado')" value="Pagar">
            </div>

        </form>

    </div>
    <script>
        console.log('Hola desde la consola del desarrollador');
        
    </script>
    <script src="java.js"></script>
</body>
</html>
